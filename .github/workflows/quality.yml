name: Quality

on:
  pull_request:
  push:
    branches:
      - portfolio-improvements-2026-08

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile shutdown_plan.py
      - run: python -m unittest discover -s tests -v
